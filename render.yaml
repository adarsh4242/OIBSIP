name: Deploy backend to Render

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: "18"
  BACKEND_DIR: WebDev-L3-PizzaDeliveryApp/server

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.BACKEND_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Node syntax check (no tests/build present)
        shell: bash
        run: |
          set -e
          # check main entry (if present) and all .js files under typical folders
          node --check server.js || true
          # check all js files excluding node_modules
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 -I{} sh -c 'echo "Checking {}"; node --check "{}"'

      - name: Run migrations (if present)
        shell: bash
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          # run migrate:pizzas if it exists (package.json in backend has migrate:pizzas)
          if npm run | grep -qE 'migrate'; then
            echo "Running migrate:pizzas (if defined)"
            npm run migrate:pizzas || true
          else
            echo "No migrate script configured; skipping migrations."
          fi

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${RENDER_SERVICE_ID:-}" ]; then
            echo "RENDER_API_KEY and RENDER_SERVICE_ID GitHub secrets are required."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'
