name: Deploy backend to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  BACKEND_DIR: WebDev-L3-PizzaDeliveryApp/server

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebDev-L3-PizzaDeliveryApp/server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: WebDev-L3-PizzaDeliveryApp/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests when configured
        shell: bash
        run: |
          if npm run | grep -qE '^  test'; then
            npm test -- --runInBand
          else
            echo "No test script is configured; skipping tests."
          fi

      - name: Build backend when configured
        shell: bash
        run: |
          if npm run | grep -qE '^  build'; then
            npm run build
          else
            echo "No build script is configured; source validation is used below."
          fi

      - name: Validate backend source
        shell: bash
        run: |
          set -e
          node --check server.js
          find config controllers middleware models routes utils -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run migrations when configured
        shell: bash
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          if npm run | grep -qE '^  migrate'; then
            npm run migrate:pizzas
          else
            echo "No migration script is configured; skipping migrations."
          fi

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${RENDER_SERVICE_ID:-}" ]; then
            echo "RENDER_API_KEY and RENDER_SERVICE_ID GitHub secrets are required."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'
